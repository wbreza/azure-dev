syntax = "proto3";

package azdext;

// Use a valid Go import path reflecting your project structure
option go_package = "gen/grpc;azdext";

// The greeting service definition.
service Greeter {
  // Sends a greeting.
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greeting.
message HelloReply {
  string message = 1;
}
